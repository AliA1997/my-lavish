<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1d2330;
    --muted: #5a6475;
    --accent: #2f6fed;
    --card: #f3f5f9;
    --line: #c9d0dc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c;
      --fg: #e6e9ef;
      --muted: #9aa4b5;
      --accent: #7aa2ff;
      --card: #1b202b;
      --line: #3a4252;
    }
  }
  html, body { background: var(--bg); color: var(--fg); }
  body { font: 16px/1.6 system-ui, sans-serif; max-width: 720px; margin: 0 auto; padding: 32px 16px; }
  h1 { margin: 0 0 8px; }
  p { color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin: 24px 0; }
  svg { width: 100%; height: auto; }
  svg rect { fill: var(--card); stroke: var(--accent); stroke-width: 2; }
  svg text { fill: var(--fg); font: 14px system-ui, sans-serif; text-anchor: middle; }
  svg path { stroke: var(--muted); stroke-width: 2; fill: none; }
  svg polygon { fill: var(--muted); }
  label { display: block; margin: 6px 0; }
  button { background: var(--accent); color: var(--bg); border: 0; border-radius: 6px; padding: 8px 16px; font: inherit; cursor: pointer; margin-top: 8px; }
</style>
</head>
<body>
<h1>Plan</h1>
<p>This page shows a small plan for adding a feature. Click any element to leave a note on it. Select a sentence to comment on just that text.</p>

<div class="card">
<svg viewBox="0 0 600 90" role="img" aria-label="Flow: Draft, Review, Ship">
  <rect x="10" y="20" width="150" height="50" rx="8"/>
  <text x="85" y="50">Draft</text>
  <path d="M160 45 H212"/><polygon points="212,38 225,45 212,52"/>
  <rect x="225" y="20" width="150" height="50" rx="8"/>
  <text x="300" y="50">Review</text>
  <path d="M375 45 H427"/><polygon points="427,38 440,45 427,52"/>
  <rect x="440" y="20" width="150" height="50" rx="8"/>
  <text x="515" y="50">Ship</text>
</svg>
</div>

<div class="card">
<h2>Which step should we do first?</h2>
<form id="q">
  <label><input type="radio" name="step" value="draft" checked> Draft the design</label>
  <label><input type="radio" name="step" value="review"> Get a review</label>
  <label><input type="radio" name="step" value="ship"> Ship a prototype</label>
  <button type="button" id="submit" data-lavish-action>Submit</button>
</form>
</div>

<script>
  document.getElementById("submit").addEventListener("click", function () {
    var checked = document.querySelector('input[name="step"]:checked');
    var answer = { question: "Which step should we do first?", answer: checked ? checked.value : null };
    window.lavish && window.lavish.queuePrompt(JSON.stringify(answer));
  });
</script>
</body>
</html>
