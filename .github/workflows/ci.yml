name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run smoke
      - run: npm run smoke:workflow

  # 3.7: a container has no display: no window, no browser, and Connect Claude falls back to a command to copy.
  headless:
    runs-on: ubuntu-latest
    container: node:22
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: npm ci
      - run: npm run smoke
      - name: Check the headless behaviour
        run: |
          unset CI DISPLAY WAYLAND_DISPLAY
          export MY_LAVISH_STATE_DIR="$(mktemp -d)"
          out="$(node bin/see-plan.js open examples/plan.html --json)"
          echo "$out"
          echo "$out" | grep -q '"opened": false'
          echo "$out" | grep -q '"mode": "hidden"'
          node bin/see-plan.js stop

  executable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: npm run build:sea
      - run: npm run smoke:bin
